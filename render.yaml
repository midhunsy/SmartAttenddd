databases:
  - name: smartattend-db
    databaseName: smartattend
    user: smartattend
    plan: free

services:
  - type: web
    name: smartattend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartattend-db
          property: connectionString
